%YAML 1.2
---
$id: http://devicetree.org/schemas/test-property-name.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Test fixture with incorrect property names

maintainers:
  - Rob Herring <robh@kernel.org>

properties:
  compatible:
    const: example,test-property-name
  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    foo@1000 {
        compatible = "example,test-property-name";
        reg = <0x1000 0x100>;

        property#foo;
        property+foo;
        property-foo;
        property-foo-;
        property.foo;
        property?foo;
        property_foo;

        vendor,property#foo;
        vendor,property+foo;
        vendor,property,foo;
        vendor,property-foo;
        vendor,property-foo-;
        vendor,property.foo;
        vendor,property?foo;
        vendor,property_foo;
    };
