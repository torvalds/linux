%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/ti,keystone,psc-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI Keystone PSC clock

maintainers:
  - Santosh Shilimkar <santosh.shilimkar@ti.com>
  - Murali Karicheri <m-karicheri2@ti.com>

properties:
  compatible:
    const: ti,keystone,psc-clock

  reg:
    items:
      - description: PSC control
      - description: Domain

  reg-names:
    items:
      - const: control
      - const: domain

  domain-id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: PSC domain id needed to check the transition state register

  clocks:
    maxItems: 1

  clock-output-names:
    maxItems: 1

  "#clock-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - domain-id
  - clocks
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    clkusb@2350008 {
        compatible = "ti,keystone,psc-clock";
        reg = <0x02350008 0xb00>, <0x02350000 0x400>;
        reg-names = "control", "domain";
        domain-id = <0>;
        clocks = <&chipclk16>;
        clock-output-names = "usb";
        #clock-cells = <0>;
    };
