# SPDX-License-Identifier: (GPL-2.0-only OR BSD-2-Clause)
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm8450-camcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Camera Clock & Reset Controller on SM8450

maintainers:
  - Vladimir Zapolskiy <vladimir.zapolskiy@linaro.org>
  - Jagadeesh Kona <quic_jkona@quicinc.com>
  - Taniya Das <taniya.das@oss.qualcomm.com>

description: |
  Qualcomm camera clock control module provides the clocks, resets and power
  domains on SM8450.

  See also:
    include/dt-bindings/clock/qcom,hawi-camcc.h
    include/dt-bindings/clock/qcom,kaanapali-camcc.h
    include/dt-bindings/clock/qcom,kaanapali-cambistmclkcc.h
    include/dt-bindings/clock/qcom,nord-camcc.h
    include/dt-bindings/clock/qcom,sm8450-camcc.h
    include/dt-bindings/clock/qcom,sm8550-camcc.h
    include/dt-bindings/clock/qcom,sm8650-camcc.h
    include/dt-bindings/clock/qcom,sm8750-cambistmclkcc.h
    include/dt-bindings/clock/qcom,sm8750-camcc.h

properties:
  compatible:
    oneOf:
      - enum:
          - qcom,hawi-camcc
          - qcom,kaanapali-cambistmclkcc
          - qcom,kaanapali-camcc
          - qcom,maili-camcc
          - qcom,nord-camcc
          - qcom,sm8450-camcc
          - qcom,sm8475-camcc
          - qcom,sm8550-camcc
          - qcom,sm8650-camcc
          - qcom,sm8750-cambistmclkcc
          - qcom,sm8750-camcc
      - items:
          - enum:
              - qcom,hawi-cambistmclkcc
              - qcom,maili-cambistmclkcc
          - const: qcom,kaanapali-cambistmclkcc

  clocks:
    items:
      - description: Camera AHB clock from GCC
      - description: Board XO source
      - description: Board active XO source
      - description: Sleep clock source

  interconnects:
    items:
      - description: Interconnect path to enable the MultiMedia NoC

  power-domains:
    description:
      Power domains required for the clock controller to operate
    items:
      - description: MMCX power domain
      - description: MXC power domain

  required-opps:
    description:
      OPP nodes that describe required performance points on power domains
    items:
      - description: MMCX performance point
      - description: MXC performance point

  reg:
    maxItems: 1

required:
  - compatible
  - clocks
  - power-domains

allOf:
  - $ref: qcom,gcc.yaml#
  - if:
      properties:
        compatible:
          not:
            contains:
              enum:
                - qcom,sm8475-camcc
                - qcom,sm8650-camcc
    then:
      required:
        - required-opps
  - if:
      properties:
        compatible:
          contains:
            enum:
              - qcom,hawi-camcc
              - qcom,maili-camcc
    then:
      required:
        - interconnects

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-sm8450.h>
    #include <dt-bindings/interconnect/qcom,icc.h>
    #include <dt-bindings/interconnect/qcom,sm8450.h>
    #include <dt-bindings/clock/qcom,rpmh.h>
    #include <dt-bindings/power/qcom,rpmhpd.h>
    clock-controller@ade0000 {
      compatible = "qcom,sm8450-camcc";
      reg = <0xade0000 0x20000>;
      clocks = <&gcc GCC_CAMERA_AHB_CLK>,
               <&rpmhcc RPMH_CXO_CLK>,
               <&rpmhcc RPMH_CXO_CLK_A>,
               <&sleep_clk>;
      power-domains = <&rpmhpd RPMHPD_MMCX>,
                      <&rpmhpd RPMHPD_MXC>;
      required-opps = <&rpmhpd_opp_low_svs>,
                      <&rpmhpd_opp_low_svs>;
      interconnects = <&mmss_noc MASTER_CAMNOC_HF QCOM_ICC_TAG_ALWAYS
                      &mmss_noc SLAVE_MNOC_HF_MEM_NOC QCOM_ICC_TAG_ALWAYS>;
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
    };
...
