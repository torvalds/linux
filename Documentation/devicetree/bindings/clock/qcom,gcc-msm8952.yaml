%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,gcc-msm8952.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Global Clock & Reset Controller on MSM8952

maintainers:
  - Muzaffer Kadir <muzafferkadir@mainlining.org>

description: |
  Qualcomm global clock control module provides the clocks, resets and power
  domains on MSM8952.

  See also:
    include/dt-bindings/clock/qcom,gcc-msm8952.h

properties:
  compatible:
    enum:
      - qcom,gcc-msm8952

  clocks:
    items:
      - description: XO source
      - description: Always-on XO source
      - description: DSI phy instance 0 dsi clock
      - description: DSI phy instance 0 byte clock

  power-domains:
    items:
      - description: CX power domain

required:
  - compatible
  - clocks
  - power-domains
  - '#power-domain-cells'

allOf:
  - $ref: qcom,gcc.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,dsi-phy-28nm.h>
    #include <dt-bindings/clock/qcom,gcc-msm8952.h>
    #include <dt-bindings/clock/qcom,rpmcc.h>
    #include <dt-bindings/power/qcom-rpmpd.h>

    clock-controller@1800000 {
        compatible = "qcom,gcc-msm8952";
        reg = <0x01800000 0x80000>;
        clocks = <&rpmcc RPM_SMD_XO_CLK_SRC>,
                 <&rpmcc RPM_SMD_XO_A_CLK_SRC>,
                 <&mdss_dsi0_phy DSI_PIXEL_PLL_CLK>,
                 <&mdss_dsi0_phy DSI_BYTE_PLL_CLK>;
        power-domains = <&rpmpd RPMPD_VDDCX>;
        #clock-cells = <1>;
        #reset-cells = <1>;
        #power-domain-cells = <1>;
    };
...
