%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/anlogic,dr1v90-cru.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Anlogic DR1V90 Clock and Reset Unit (CRU)

maintainers:
  - Junhui Liu <junhui.liu@pigmoral.tech>

properties:
  compatible:
    const: anlogic,dr1v90-cru

  reg:
    maxItems: 1

  clocks:
    minItems: 1
    maxItems: 3
    description:
      The main oscillator is always required. Either or both of the external CAN
      and WDT clocks may also be provided if the board routes them to the SoC.

  clock-names:
    minItems: 1
    items:
      - const: osc
      - enum: [can_ext, wdt_ext]
      - const: wdt_ext

  "#clock-cells":
    const: 1
    description:
      Refer <dt-bindings/clock/anlogic,dr1v90-cru.h> for valid indices.

  "#reset-cells":
    const: 1
    description:
      Refer <dt-bindings/reset/anlogic,dr1v90-cru.h> for valid indices.

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - "#clock-cells"
  - "#reset-cells"

additionalProperties: false

examples:
  - |
    clock-controller@f8801000 {
        compatible = "anlogic,dr1v90-cru";
        reg = <0xf8801000 0x400>;
        clocks = <&osc>, <&can_ext>, <&wdt_ext>;
        clock-names = "osc", "can_ext", "wdt_ext";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
