%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,milos-camcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Camera Clock & Reset Controller on Milos

maintainers:
  - Luca Weiss <luca.weiss@fairphone.com>
  - Taniya Das <taniya.das@oss.qualcomm.com>

description: |
  Qualcomm camera clock control module provides the clocks, resets and power
  domains on Milos.

  See also:
    include/dt-bindings/clock/qcom,eliza-cambistmclkcc.h
    include/dt-bindings/clock/qcom,eliza-camcc.h
    include/dt-bindings/clock/qcom,milos-camcc.h

properties:
  compatible:
    enum:
      - qcom,eliza-cambistmclkcc
      - qcom,eliza-camcc
      - qcom,milos-camcc

  clocks:
    items:
      - description: Board XO source
      - description: Sleep clock source
      - description: Camera AHB clock from GCC

  interconnects:
    items:
      - description: Interconnect path to enable the MultiMedia NoC

  power-domains:
    items:
      - description: CX power domain
      - description: MX power domain

  required-opps:
    items:
      - description: CX performance point
      - description: MX performance point

required:
  - compatible
  - clocks
  - power-domains
  - required-opps

allOf:
  - $ref: qcom,gcc.yaml#
  - if:
      not:
        properties:
          compatible:
            contains:
              const: qcom,eliza-cambistmclkcc
    then:
      required:
        - '#power-domain-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,milos-gcc.h>
    #include <dt-bindings/interconnect/qcom,icc.h>
    #include <dt-bindings/interconnect/qcom,milos-rpmh.h>
    #include <dt-bindings/power/qcom,rpmhpd.h>
    clock-controller@adb0000 {
        compatible = "qcom,milos-camcc";
        reg = <0x0adb0000 0x40000>;
        clocks = <&bi_tcxo_div2>,
                 <&sleep_clk>,
                 <&gcc GCC_CAMERA_AHB_CLK>;
        interconnects = <&mmss_noc MASTER_CAMNOC_HF QCOM_ICC_TAG_ALWAYS
                         &mmss_noc SLAVE_MNOC_HF_MEM_NOC QCOM_ICC_TAG_ALWAYS>;

        power-domains = <&rpmhpd RPMHPD_CX>,
                        <&rpmhpd RPMHPD_MX>;
        required-opps = <&rpmhpd_opp_low_svs>,
                        <&rpmhpd_opp_low_svs>;

        #clock-cells = <1>;
        #reset-cells = <1>;
        #power-domain-cells = <1>;
    };

...
