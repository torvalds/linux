%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek-jpeg-encoder.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek JPEG Encoder

maintainers:
  - Xia Jiang <xia.jiang@mediatek.com>

description: |-
  MediaTek JPEG Encoder is the JPEG encode hardware present in MediaTek SoCs

properties:
  compatible:
    oneOf:
      - enum:
          - mediatek,mt8189-jpgenc
      - items:
          - enum:
              - mediatek,mt2701-jpgenc
              - mediatek,mt8183-jpgenc
              - mediatek,mt8186-jpgenc
              - mediatek,mt8188-jpgenc
          - const: mediatek,mtk-jpgenc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: jpgenc

  power-domains:
    maxItems: 1

  iommus:
    minItems: 2
    maxItems: 32
    description: |
      Points to the respective IOMMU block with master port as argument, see
      Documentation/devicetree/bindings/iommu/mediatek,iommu.yaml for details.
      Ports are according to the HW.

  mediatek,larb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: |
      A phandle to the local arbiter (SMI LARB) node. This explicitly
      describes the hardware topology where the JPEG block is connected
      to a dedicated SMI LARB for memory bandwidth arbitration. It is
      required to accurately represent the hardware connection independently
      of the IOMMU.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - iommus

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: mediatek,mt8189-jpgenc
    then:
      required:
        - mediatek,larb
    else:
      properties:
        mediatek,larb: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mt2701-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/memory/mt2701-larb-port.h>
    #include <dt-bindings/power/mt2701-power.h>
    jpegenc: jpegenc@1500a000 {
      compatible = "mediatek,mt2701-jpgenc",
                   "mediatek,mtk-jpgenc";
      reg = <0x1500a000 0x1000>;
      interrupts = <GIC_SPI 141 IRQ_TYPE_LEVEL_LOW>;
      clocks =  <&imgsys CLK_IMG_VENC>;
      clock-names = "jpgenc";
      power-domains = <&scpsys MT2701_POWER_DOMAIN_ISP>;
      iommus = <&iommu MT2701_M4U_PORT_JPGENC_RDMA>,
               <&iommu MT2701_M4U_PORT_JPGENC_BSDMA>;
    };
