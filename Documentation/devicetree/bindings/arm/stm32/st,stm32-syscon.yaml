%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/stm32/st,stm32-syscon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32 Platforms System Controller

maintainers:
  - Alexandre Torgue <alexandre.torgue@foss.st.com>
  - Christophe Roullier <christophe.roullier@foss.st.com>

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - st,stm32-power-config
              - st,stm32-syscfg
              - st,stm32-tamp
              - st,stm32f4-gcan
              - st,stm32mp151-pwr-mcu
              - st,stm32mp157-syscfg
              - st,stm32mp21-syscfg
              - st,stm32mp23-syscfg
              - st,stm32mp25-syscfg
          - const: syscon
      - items:
          - const: st,stm32-tamp
          - const: syscon
          - const: simple-mfd

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  "#clock-cells":
    const: 0

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

patternProperties:
  "^phy@2[48]00$":
    type: object
    $ref: /schemas/phy/st,stm32-usb2phy.yaml

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - st,stm32mp157-syscfg
              - st,stm32f4-gcan
    then:
      required:
        - clocks
    else:
      properties:
        clocks: false
  - if:
      properties:
        compatible:
          contains:
            enum:
              - st,stm32mp23-syscfg
              - st,stm32mp25-syscfg
    then:
      required:
        - "#address-cells"
        - "#clock-cells"
        - "#size-cells"
        - phy@2400
        - phy@2800
    else:
      properties:
        '#address-cells': false
        '#clock-cells': false
        '#size-cells': false
        phy@2400: false
        phy@2800: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/stm32mp1-clks.h>
    syscfg: syscon@50020000 {
        compatible = "st,stm32mp157-syscfg", "syscon";
        reg = <0x50020000 0x400>;
        clocks = <&rcc SYSCFG>;
    };

...
