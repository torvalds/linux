%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/google.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor platforms

maintainers:
  - Peter Griffin <peter.griffin@linaro.org>

description: |
  ARM platforms using SoCs designed by Google branded "Tensor" used in Pixel
  devices.

  Currently upstream this is devices using gs101 SoC which is found in Pixel
  6, Pixel 6 Pro and Pixel 6a and Laguna SoC canonically referred to as lga
  found in Pixel 10, Pixel 10 Pro and Pixel 10 Pro XL.

properties:
  $nodename:
    const: '/'
  compatible:
    oneOf:
      # Google Tensor G1 AKA gs101 AKA whitechapel AKA Die ID S5P9845 boards
      - description: Google Pixel 6 or 6 Pro (Oriole or Raven)
        items:
          - enum:
              - google,gs101-oriole
              - google,gs101-raven
          - const: google,gs101

      # Google Tensor G5 AKA lga (laguna) SoC and boards
      - description:
          Google Pixel 10, 10 Pro, 10 Pro XL (Frankel, Blazer,
          Mustang).
        items:
          - enum:
              - google,lga-blazer
              - google,lga-frankel
              - google,lga-mustang
          - const: google,lga

  ect:
    type: object
    additionalProperties: false

additionalProperties: true

allOf:
  # Bootloader requires empty ect node to be present
  - if:
      properties:
        compatible:
          contains:
            const: google,gs101
    then:
      required:
        - ect
    else:
      properties:
        ect: false

...
