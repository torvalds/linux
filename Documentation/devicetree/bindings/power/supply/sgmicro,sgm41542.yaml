%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/sgmicro,sgm41542.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SGM41542 Battery Charger

description:
  The SGMicro SGM41542 is a single cell battery charger/boost controller.

maintainers:
  - Chris Morgan <macromorgan@hotmail.com>
  - Xu Shengfei <xsf@rock-chips.com>

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: sgmicro,sgm41542

  input-current-limit-microamp:
    default: 2400000
    minimum: 100000
    maximum: 3800000

  input-voltage-limit-microvolt:
    default: 4500000
    minimum: 3900000
    maximum: 12000000

  interrupts:
    maxItems: 1

  monitored-battery:
    description: |
        The charger uses the following battery properties
        constant-charge-current-max-microamp (default 2040000)
        constant-charge-voltage-max-microvolt (default 4208000)
        charge-term-current-microamp (default 180000)
        precharge-current-microamp (default 180000)

  reg:
    maxItems: 1

  regulators:
    type: object
    properties:
      otg-vbus:
        type: object
        description: OTG boost regulator
        $ref: /schemas/regulator/regulator.yaml
        unevaluatedProperties: false
    additionalProperties: false

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    battery: battery {
      compatible = "simple-battery";
      constant-charge-current-max-microamp = <10000000>;
      constant-charge-voltage-max-microvolt = <4350000>;
      precharge-current-microamp = <180000>;
      charge-term-current-microamp = <300000>;
    };

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      charger@3b {
        compatible = "sgmicro,sgm41542";
        reg = <0x3b>;
        input-current-limit-microamp = <3000000>;
        input-voltage-limit-microvolt = <4500000>;
        interrupt-parent = <&gpio0>;
        interrupts = <26 IRQ_TYPE_EDGE_FALLING>;
        monitored-battery = <&battery>;

        regulators {
          otg-vbus {
            regulator-max-microvolt = <5000000>;
            regulator-min-microvolt = <5000000>;
          };
        };
      };
    };
