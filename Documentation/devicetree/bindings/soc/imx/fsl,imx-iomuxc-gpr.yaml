%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/imx/fsl,imx-iomuxc-gpr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Freescale IOMUX Controller General Purpose Registers

maintainers:
  - Peng Fan <peng.fan@nxp.com>

description:
  i.MX Processors have an IOMUXC General Purpose Register group for
  various System Settings

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - fsl,imx6q-iomuxc-gpr
              - fsl,imx8mq-iomuxc-gpr
          - const: syscon
          - const: simple-mfd
      - items:
          - enum:
              - fsl,imx6sl-iomuxc-gpr
              - fsl,imx6sll-iomuxc-gpr
              - fsl,imx6ul-iomuxc-gpr
          - const: fsl,imx6q-iomuxc-gpr
          - const: syscon
      - items:
          - enum:
              - fsl,imx6sx-iomuxc-gpr
              - fsl,imx7d-iomuxc-gpr
          - const: fsl,imx6q-iomuxc-gpr
          - const: syscon
          - const: simple-mfd
      - items:
          - enum:
              - fsl,imx53-iomuxc-gpr
              - fsl,imx8mm-iomuxc-gpr
              - fsl,imx8mn-iomuxc-gpr
              - fsl,imx8mp-iomuxc-gpr
          - const: syscon

  reg:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 1

  ranges: true

  mux-controller:
    type: object
    $ref: /schemas/mux/reg-mux.yaml

  bridge@18:
    type: object
    $ref: /schemas/display/bridge/fsl,ldb.yaml#
    unevaluatedProperties: false

patternProperties:
  "^ipu[12]_csi[01]_mux$":
    type: object
    $ref: /schemas/media/video-mux.yaml

allOf:
  - if:
      properties:
        compatible:
          not:
            contains:
              const: fsl,imx6q-iomuxc-gpr
    then:
      patternProperties:
        '^ipu[12]_csi[01]_mux$': false

  - if:
      properties:
        compatible:
          not:
            contains:
              const: fsl,imx6sx-iomuxc-gpr
    then:
      properties:
        bridge@18: false
        '#address-cells': false
        '#size-cells': false
        ranges: false

additionalProperties: false

required:
  - compatible
  - reg

examples:
  # Pinmux controller node
  - |
    iomuxc_gpr: syscon@30340000 {
        compatible = "fsl,imx8mq-iomuxc-gpr", "syscon", "simple-mfd";
        reg = <0x30340000 0x10000>;

        mux: mux-controller {
            compatible = "mmio-mux";
            #mux-control-cells = <1>;
            mux-reg-masks = <0x34 0x00000004>; /* MIPI_MUX_SEL */
        };
    };

  - |
    #include <dt-bindings/clock/imx6sx-clock.h>

    syscon@20e4000 {
        compatible = "fsl,imx6sx-iomuxc-gpr", "fsl,imx6q-iomuxc-gpr", "syscon", "simple-mfd";
        reg = <0x020e4000 0x4000>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;

        bridge@18 {
            compatible = "fsl,imx6sx-ldb";
            reg = <0x18 0x4>;
            clocks = <&clks IMX6SX_CLK_LDB_DI0>;
            clock-names = "ldb";

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    endpoint {
                    };
                };

                port@1 {
                    reg = <1>;

                    endpoint {
                    };
                };
            };
        };
    };
...
