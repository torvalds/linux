%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ti,da830-ohci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: DA8XX USB OHCI controller

maintainers:
  - Axel Haslam <ahaslam@baylibre.com>

allOf:
  - $ref: usb-hcd.yaml#

properties:
  compatible:
    const: ti,da830-ohci

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  phys:
    maxItems: 1

  clocks:
    maxItems: 1

  phy-names:
    const: usb-phy

  vbus-supply:
    description:
      phandle of regulator that controls vbus power / over-current

  oc-gpios:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - phys
  - phy-names
  - clocks

unevaluatedProperties: false

examples:
  - |
    usb@225000 {
        compatible = "ti,da830-ohci";
        reg = <0x225000 0x1000>;
        interrupts = <59>;
        phys = <&usb_phy 1>;
        phy-names = "usb-phy";
        clocks = <&psc1 2>;
        vbus-supply = <&reg_usb_ohci>;
    };
