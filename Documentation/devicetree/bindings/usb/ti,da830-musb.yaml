%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ti,da830-musb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI DA8xx MUSB

maintainers:
  - Bin Liu <b-liu@ti.com>

allOf:
  - $ref: /schemas/usb/usb-drd.yaml#

properties:
  compatible:
    const: ti,da830-musb

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: mc

  phys:
    maxItems: 1

  phy-names:
    const: usb-phy

  dmas:
    minItems: 1
    maxItems: 8

  dma-names:
    minItems: 1
    maxItems: 8
    items:
      pattern: "^(rx|tx)[1-4]$"

  vbus-supply:
    description: Phandle to a regulator providing the USB bus power.

  clocks:
    maxItems: 1

  clock-ranges: true

  ranges: true

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

patternProperties:
  "^dma-controller@[0-9a-f]+$":
    $ref: /schemas/dma/ti/ti,cppi41.yaml#

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - phys
  - phy-names
  - ranges
  - "#address-cells"
  - "#size-cells"

unevaluatedProperties: false

examples:
  - |
    usb@200000 {
        compatible = "ti,da830-musb";
        reg = <0x00200000 0x1000>;
        ranges;
        #address-cells = <1>;
        #size-cells = <1>;
        interrupts = <58>;
        interrupt-names = "mc";

        dr_mode = "host";
        vbus-supply = <&usb_vbus>;
        phys = <&usb_phy 0>;
        phy-names = "usb-phy";

        clocks = <&psc1 1>;
        clock-ranges;

        dmas = <&cppi41dma 0 0>, <&cppi41dma 1 0>,
               <&cppi41dma 2 0>, <&cppi41dma 3 0>,
               <&cppi41dma 0 1>, <&cppi41dma 1 1>,
               <&cppi41dma 2 1>, <&cppi41dma 3 1>;
        dma-names = "rx1", "rx2", "rx3", "rx4",
                    "tx1", "tx2", "tx3", "tx4";

        dma-controller@201000 {
            compatible = "ti,da830-cppi41";
            reg = <0x201000 0x1000>,
                  <0x202000 0x1000>,
                  <0x204000 0x4000>;
            reg-names = "controller", "scheduler", "queuemgr";
            interrupts = <58>;
            #dma-cells = <2>;
            dma-channels = <4>;
        };
    };
