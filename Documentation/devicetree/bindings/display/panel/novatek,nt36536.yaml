%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/novatek,nt36536.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36536 based DSI display Panels

maintainers:
  - Pengyu Luo <mitltlatltl@gmail.com>

description:
  The Novatek NT36536 is a generic DSI Panel IC used to drive dsi
  panels. Support video mode panels from China Star Optoelectronics
  Technology (CSOT), such as PP8807HB1-1 which is a dual-link 10-bit
  panel.

allOf:
  - $ref: panel-common-dual.yaml#

properties:
  compatible:
    items:
      - enum:
          - csot,pp8807hb1-1
      - const: novatek,nt36536

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vddio-supply:
    description: I/O source voltage rail

  vsp-supply:
    description: Positive source voltage rail

  vsn-supply:
    description: Negative source voltage rail

  backlight: true
  ports: true

required:
  - compatible
  - reg
  - vddio-supply
  - reset-gpios
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "csot,pp8807hb1-1", "novatek,nt36536";
            reg = <0>;

            vddio-supply = <&vreg_iovdd_1p8>;
            reset-gpios = <&tlmm 98 GPIO_ACTIVE_LOW>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;
                    panel_in_0: endpoint {
                        remote-endpoint = <&dsi0_out>;
                    };
                };

                port@1{
                    reg = <1>;
                    panel_in_1: endpoint {
                        remote-endpoint = <&dsi1_out>;
                    };
                };
            };
        };
    };

...
