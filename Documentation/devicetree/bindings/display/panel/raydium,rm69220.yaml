%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/raydium,rm69220.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Raydium RM69220 based MIPI-DSI panels

maintainers:
  - Alexander Koskovich <akoskovich@pm.me>

description:
  The Raydium RM69220 is a generic DSI Panel IC used to control
  AMOLED panels.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - enum:
          - boe,bf068mwm-td0
      - const: raydium,rm69220

  reg:
    maxItems: 1

  dvdd-supply:
    description: Digital voltage rail

  vci-supply:
    description: Analog voltage rail

  vddio-supply:
    description: I/O voltage rail

required:
  - compatible
  - reg
  - dvdd-supply
  - vci-supply
  - vddio-supply
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "boe,bf068mwm-td0", "raydium,rm69220";
            reg = <0>;

            reset-gpios = <&tlmm 12 GPIO_ACTIVE_LOW>;
            dvdd-supply = <&vreg_oled_dvdd_1p8>;
            vci-supply = <&vreg_l19b>;
            vddio-supply = <&vreg_l9b>;

            port {
                panel_in_0: endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };

...
