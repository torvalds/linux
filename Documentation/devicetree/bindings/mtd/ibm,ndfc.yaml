%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/ibm,ndfc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: IBM/AMCC NDFC (NAND Flash Controller)

maintainers:
  - Miquel Raynal <miquel.raynal@bootlin.com>
  - Richard Weinberger <richard@nod.at>

description: |
  The NDFC is the NAND flash controller integrated into the IBM/AMCC
  PowerPC 44x SoCs.

allOf:
  - $ref: nand-controller-legacy.yaml#

properties:
  compatible:
    const: ibm,ndfc

  reg:
    description: Chip select and size used for the chip.
    maxItems: 1

  ccr:
    description: NDFC config and control register value.
    $ref: /schemas/types.yaml#/definitions/uint32

  bank-settings:
    description: NDFC bank configuration register value.
    $ref: /schemas/types.yaml#/definitions/uint32

  nand:
    type: object
    description: |
      NAND chip attached to the controller. The driver picks the first
      child of the controller node, so this node is not required to be
      named "nand@<cs>".

    allOf:
      - $ref: mtd.yaml#
      - $ref: nand-property.yaml#
      - $ref: raw-nand-property.yaml#

    properties:
      "#address-cells":
        const: 1
      "#size-cells":
        const: 1

    patternProperties:
      "^partition@[0-9a-f]+$":
        $ref: /schemas/mtd/partitions/partition.yaml#/$defs/partition-node
        deprecated: true

    unevaluatedProperties: false

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    ebc {
        #address-cells = <2>;
        #size-cells = <1>;

        ndfc@1,0 {
            compatible = "ibm,ndfc";
            reg = <0x00000001 0x00000000 0x00002000>;
            ccr = <0x00001000>;
            bank-settings = <0x80002222>;
            #address-cells = <1>;
            #size-cells = <1>;

            nand {
                #address-cells = <1>;
                #size-cells = <1>;

                partition@0 {
                    label = "kernel";
                    reg = <0x00000000 0x00200000>;
                };
                partition@200000 {
                    label = "root";
                    reg = <0x00200000 0x03e00000>;
                };
            };
        };
    };
  - |
    ebc {
        #address-cells = <2>;
        #size-cells = <1>;

        ndfc@1,0 {
            compatible = "ibm,ndfc";
            reg = <0x00000001 0x00000000 0x00002000>;
            #address-cells = <1>;
            #size-cells = <1>;

            nand {
                #address-cells = <1>;
                #size-cells = <1>;

                partitions {
                    compatible = "fixed-partitions";
                    #address-cells = <1>;
                    #size-cells = <1>;

                    partition@0 {
                        label = "kernel";
                        reg = <0x00000000 0x00200000>;
                    };
                    partition@200000 {
                        label = "root";
                        reg = <0x00200000 0x03e00000>;
                    };
                };
            };
        };
    };
...
