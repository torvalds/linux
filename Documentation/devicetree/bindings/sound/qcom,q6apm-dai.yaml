%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qcom,q6apm-dai.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Audio Process Manager Digital Audio Interfaces

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

description: |
  This binding describes the Qualcomm APM DAIs in DSP

properties:
  compatible:
    const: qcom,q6apm-dais

  iommus:
    minItems: 1
    maxItems: 2

  memory-region:
    minItems: 1
    items:
      - description:
          Control-path buffer (audio_heap_mem) for platforms where the DSP
          runs in a stage-2 protected context (e.g. modem-DSP).
      - description:
          Data-path buffer pool from which per-stream DMA buffers are
          allocated.

required:
  - compatible

oneOf:
  - required:
      - iommus
  - required:
      - memory-region

additionalProperties: false

examples:
  - |
    dais {
        compatible = "qcom,q6apm-dais";
        iommus = <&apps_smmu 0x1801 0x0>;
    };
