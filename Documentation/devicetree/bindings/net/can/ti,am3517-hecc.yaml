%YAML 1.2
---
$id: http://devicetree.org/schemas/net/can/ti,am3517-hecc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments High End CAN Controller (HECC)

maintainers:
  - Eduard Bostina <egbostina@gmail.com>

allOf:
  - $ref: can-controller.yaml#

properties:
  compatible:
    const: ti,am3517-hecc

  reg:
    maxItems: 3

  reg-names:
    items:
      - const: hecc
      - const: hecc-ram
      - const: mbx

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  ti,use-hecc1int:
    type: boolean
    description:
      If provided, configures HECC to produce all interrupts on the
      HECC1INT interrupt line. By default, the HECC0INT interrupt line
      will be used.
    default: false

  xceiver-supply:
    description: Regulator that powers the CAN transceiver.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    can@5c050000 {
        compatible = "ti,am3517-hecc";
        reg = <0x5c050000 0x80>,
              <0x5c053000 0x180>,
              <0x5c052000 0x200>;
        reg-names = "hecc", "hecc-ram", "mbx";
        interrupts = <24>;
        clocks = <&hecc_ck>;
    };
