          properties:
            reg: { minimum: 8, maximum: 11 }
  - if:
      properties:
        reg: { const: 9 }
    then:
      patternProperties:
        "^ethernet-phy@[a-f0-9]+$":
          properties:
            reg: { minimum: 9, maximum: 12 }
  - if:
      properties:
        reg: { const: 10 }
    then:
      patternProperties:
        "^ethernet-phy@[a-f0-9]+$":
          properties:
            reg: { minimum: 10, maximum: 13 }
  - if:
      properties:
