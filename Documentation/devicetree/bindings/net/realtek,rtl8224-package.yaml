unevaluatedProperties: false

examples:
  - |
    mdio {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy-package@1 {
            compatible = "realtek,rtl8224-package";
            reg = <1>;
            #address-cells = <1>;
            #size-cells = <0>;

            ethernet-phy@1 {
                compatible = "ethernet-phy-ieee802.3-c45";
                reg = <1>;
                enet-phy-pair-order = <0>;
            };

            ethernet-phy@2 {
                compatible = "ethernet-phy-ieee802.3-c45";
                reg = <2>;
                enet-phy-pair-order = <0>;
            };

            ethernet-phy@3 {
                compatible = "ethernet-phy-ieee802.3-c45";
                reg = <3>;
                enet-phy-pair-order = <1>;
            };

            ethernet-phy@4 {
                compatible = "ethernet-phy-ieee802.3-c45";
                reg = <4>;
                enet-phy-pair-order = <1>;
                enet-phy-pair-polarity = <0x1>;
            };
        };
    };
