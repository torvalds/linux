%YAML 1.2
---
$id: http://devicetree.org/schemas/net/realtek,rtl9301-mdio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek Otto Switches Ethernet MDIO Controller

maintainers:
  - Chris Packham <chris.packham@alliedtelesis.co.nz>

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - realtek,rtl8381-mdio
              - realtek,rtl8382-mdio
          - const: realtek,rtl8380-mdio
      - items:
          - enum:
              - realtek,rtl8392-mdio
              - realtek,rtl8393-mdio
          - const: realtek,rtl8391-mdio
      - items:
          - enum:
              - realtek,rtl9302b-mdio
              - realtek,rtl9302c-mdio
              - realtek,rtl9303-mdio
          - const: realtek,rtl9301-mdio
      - items:
          - enum:
              - realtek,rtl9312-mdio
              - realtek,rtl9313-mdio
          - const: realtek,rtl9311-mdio
      - enum:
          - realtek,rtl8380-mdio
          - realtek,rtl8391-mdio
          - realtek,rtl9301-mdio
          - realtek,rtl9311-mdio

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  reg:
    maxItems: 1

patternProperties:
  '^mdio-bus@[0-3]$':
    $ref: mdio.yaml#

    properties:
      reg:
        maxItems: 1

    required:
      - reg

    patternProperties:
      '^ethernet-phy@[a-f0-9]+$':
        type: object
        $ref: ethernet-phy.yaml#
        unevaluatedProperties: false

    unevaluatedProperties: false

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - realtek,rtl8380-mdio
              - realtek,rtl8381-mdio
              - realtek,rtl8382-mdio
    then:
      properties:
        mdio-bus@0:
          properties:
            clock-frequency:
              enum: [2500000, 10000000]
              default: 2500000

      patternProperties:
        '^mdio-bus@[1-3]$': false

  - if:
      properties:
        compatible:
          contains:
            enum:
              - realtek,rtl8391-mdio
              - realtek,rtl8392-mdio
              - realtek,rtl8393-mdio
    then:
      patternProperties:
        '^mdio-bus@[01]$':
          properties:
            clock-frequency:
              enum: [1250000, 2500000, 5000000]
              description: |
                RTL839x has one clock selector shared by both MDIO buses. All explicitly
                specified clock-frequency values must be identical. A bus without this
                property inherits the shared frequency selected by another available bus.
                If neither available bus specifies a frequency, 2500000 Hz is used.

        '^mdio-bus@[2-3]$': false

  - if:
      properties:
        compatible:
          contains:
            enum:
              - realtek,rtl9301-mdio
              - realtek,rtl9302b-mdio
              - realtek,rtl9302c-mdio
              - realtek,rtl9303-mdio
              - realtek,rtl9311-mdio
              - realtek,rtl9312-mdio
              - realtek,rtl9313-mdio
    then:
      patternProperties:
        '^mdio-bus@[0-3]$':
          properties:
            clock-frequency:
              enum: [1250000, 2500000, 5000000]
              default: 2500000

unevaluatedProperties: false

examples:
  - |
    mdio-controller@ca00 {
      compatible = "realtek,rtl9301-mdio";
      reg = <0xca00 0x200>;
      #address-cells = <1>;
      #size-cells = <0>;

      mdio-bus@0 {
        reg = <0>;
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@0 {
          compatible = "ethernet-phy-ieee802.3-c45";
          reg = <0>;
        };
      };

      mdio-bus@1 {
        reg = <1>;
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@0 {
          compatible = "ethernet-phy-ieee802.3-c45";
          reg = <0>;
        };
      };
    };
