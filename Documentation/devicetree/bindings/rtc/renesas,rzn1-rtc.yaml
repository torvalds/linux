%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/renesas,rzn1-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas RZ/N1 SoCs Real-Time Clock

maintainers:
  - Miquel Raynal <miquel.raynal@bootlin.com>

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - renesas,r9a06g032-rtc # RZ/N1D
          - const: renesas,rzn1-rtc   # RZ/N1

      - const: renesas,r9a09g077-rtc  # RZ/T2H

      - items:
          - const: renesas,r9a09g087-rtc  # RZ/N2H
          - const: renesas,r9a09g077-rtc  # RZ/T2H

      - const: renesas,r8a78000-rtc   # R-Car X5H

  reg:
    maxItems: 1

  interrupts:
    minItems: 3
    maxItems: 3

  interrupt-names:
    items:
      - const: alarm
      - const: timer
      - const: pps

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    minItems: 1
    items:
      - const: hclk
      - const: xtal

  power-domains:
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - power-domains

allOf:
  - $ref: rtc.yaml#

  - if:
      properties:
        compatible:
          contains:
            enum:
              - renesas,r8a78000-rtc
              - renesas,r9a09g077-rtc
              - renesas,r9a09g087-rtc
    then:
      properties:
        clocks:
          minItems: 2
        clock-names:
          minItems: 2

  - if:
      properties:
        compatible:
          contains:
            const: renesas,r8a78000-rtc
    then:
      properties:
        interrupts: false
        interrupt-names: false
      required:
        - resets
    else:
      properties:
        resets: false
      required:
        - interrupts
        - interrupt-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/r9a06g032-sysctrl.h>
    rtc@40006000 {
        compatible = "renesas,r9a06g032-rtc", "renesas,rzn1-rtc";
        reg = <0x40006000 0x1000>;
        interrupts = <GIC_SPI 66 IRQ_TYPE_EDGE_RISING>,
                     <GIC_SPI 67 IRQ_TYPE_EDGE_RISING>,
                     <GIC_SPI 68 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "alarm", "timer", "pps";
        clocks = <&sysctrl R9A06G032_HCLK_RTC>;
        clock-names = "hclk";
        power-domains = <&sysctrl>;
    };
