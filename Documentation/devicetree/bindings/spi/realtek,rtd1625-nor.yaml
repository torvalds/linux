%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/realtek,rtd1625-nor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTD1625 SPI NOR Flash Controller

maintainers:
  - Jyan Chou <jyanchou@realtek.com>
  - Yu-Chun Lin <eleanor.lin@realtek.com>

properties:
  compatible:
    enum:
      - realtek,rtd1625-nor

  reg:
    maxItems: 3

  reg-names:
    items:
      - const: ctrl
      - const: dma
      - const: dirmap

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - resets
  - "#address-cells"
  - "#size-cells"

allOf:
  - $ref: /schemas/spi/spi-controller.yaml#

unevaluatedProperties: false

examples:
  - |
    spi@14b000 {
      compatible = "realtek,rtd1625-nor";
      reg = <0x14b000 0x50>, <0x14bf00 0x30>, <0x88100000 0x2000000>;
      reg-names = "ctrl", "dma", "dirmap";
      clocks = <&cc 18>;
      resets = <&cc 26>;
      pinctrl-0 = <&spi_pins>;
      pinctrl-names = "default";
      #address-cells = <1>;
      #size-cells = <0>;
    };
