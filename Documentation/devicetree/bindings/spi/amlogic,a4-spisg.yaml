%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/amlogic,a4-spisg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic SPI Scatter-Gather Controller

maintainers:
  - Xianwei Zhao <xianwei.zhao@amlogic.com>
  - Sunny Luo <sunny.luo@amlogic.com>

properties:
  compatible:
    enum:
      - amlogic,a4-spisg
      - amlogic,a9-spisg

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: core
      - const: pclk

  resets:
    maxItems: 1

  amlogic,mo-idle-output:
    description: |
      Controls the MOSI output level when the controller is idle.
      0 - Drive MOSI low
      1 - Drive MOSI high
      2 - Follow the last transmitted bit
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2]
    default: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

allOf:
  - $ref: spi-controller.yaml#
  - if:
      not:
        properties:
          compatible:
            contains:
              enum:
                - amlogic,a9-spisg
    then:
      properties:
        amlogic,mo-idle-output: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    spi@50000 {
        compatible = "amlogic,a4-spisg";
        reg = <0x50000 0x38>;
        interrupts = <GIC_SPI 183 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clkc 37>,
                 <&clkc 93>;
        clock-names = "core", "pclk";
        #address-cells = <1>;
        #size-cells = <0>;
    };
